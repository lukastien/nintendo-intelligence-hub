version: 2

models:
  - name: stg_official__unit_sales
    description: "GRAIN: one official sell-in disclosure row. Year-to-date spans stay cumulative."
    columns:
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
  - name: stg_official__financial_line
    description: "GRAIN: one official consolidated financial disclosure row, including stocks."
    columns:
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
      - name: entity_code
        tests:
          - accepted_values:
              arguments:
                values: ["nintendo_co_ltd_consolidated"]
  - name: stg_simulated__weekly_sell_through
    description: "GRAIN: one synthetic weekly sell-through row."
    columns:
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["simulated_operational"]
          - not_null
      - name: disclaimer
        tests:
          - not_null
  - name: unit_sales_incremental_quarter
    description: >
      GRAIN: one derived fiscal quarter per fiscal year, metric, product grain,
      platform scope, region scope, and optional title. Built from adjacent
      year-to-date official disclosures. Life-to-date rows, forecasts, and
      single-quarter disclosures stay out of this mart. Q1 uses the Q1
      year-to-date total. Later quarters are the difference from the previous span.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
      - name: derivation_method
        tests:
          - accepted_values:
              arguments:
                values: ["ytd_equals_quarter", "difference_of_ytd"]
      - name: quality_flag
        tests:
          - accepted_values:
              arguments:
                values: ["ok", "restatement_or_revision"]
  - name: financial_flow_incremental_quarter
    description: >
      GRAIN: one derived fiscal quarter per fiscal year, additive statement line,
      and region scope. Stocks and non-additive metrics are excluded. The span
      rules match the unit incremental mart.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
      - name: derivation_method
        tests:
          - accepted_values:
              arguments:
                values: ["ytd_equals_quarter", "difference_of_ytd"]
  - name: financial_line_as_disclosed
    description: >
      GRAIN: one official financial disclosure, unchanged. This mart keeps the
      printed span, including year-to-date totals, life-to-date rows, forecasts,
      and balance-sheet stocks.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
  - name: weekly_sell_through
    description: >
      GRAIN: one synthetic sell-through quantity per ISO week, SKU, simulated
      region, and channel. This mart is isolated from reported results.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["simulated_operational"]
      - name: disclaimer
        tests:
          - not_null
  - name: mart_annual_platform_performance
    description: >
      GRAIN: one disclosed fiscal-year sell-in flow for one metric, platform scope,
      and region scope. Life-to-date totals, software-title rankings, and forecasts
      are excluded. A family total and its component models are separate rows.
      GLOBAL is separate from the regional rows. A later as-of date replaces an
      earlier document for the same grain. This mart does not create quarters.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: fiscal_year_ending
        tests:
          - not_null
      - name: period_span
        tests:
          - accepted_values:
              arguments:
                values: ["fiscal_year"]
      - name: observation_type
        tests:
          - accepted_values:
              arguments:
                values: ["annual_flow"]
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
      - name: region_layout
        tests:
          - accepted_values:
              arguments:
                values: ["worldwide_total", "europe_split", "europe_inside_other", "incomplete_regional_breakdown"]
      - name: reconciliation_status
        tests:
          - accepted_values:
              arguments:
                values: ["exact", "within_one_printed_unit", "differs", "incomplete_breakdown", "mixed_region_layout"]
  - name: mart_hardware_software_trends
    description: >
      GRAIN: one fiscal year, one non-component platform, and one region, with
      annual hardware sell-in and annual software sell-in side by side. A missing
      metric stays null. Component models are omitted so a family total is not
      paired with a model-level hardware row. The ratio is calculated only when
      both metrics are present and hardware is not zero.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: fiscal_year_ending
        tests:
          - not_null
      - name: observation_type
        tests:
          - accepted_values:
              arguments:
                values: ["annual_flow"]
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
  - name: mart_financial_performance
    description: >
      GRAIN: one consolidated Nintendo Co., Ltd. fiscal year. The four amount
      columns are disclosed annual flows in yen. Margin columns are calculated
      from those flows and are not the ratio lines printed on the income sheet.
      The mart has no regional or platform split and no quarters.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: fiscal_year_ending
        tests:
          - not_null
      - name: observation_type
        tests:
          - accepted_values:
              arguments:
                values: ["annual_flow"]
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
      - name: margin_basis
        tests:
          - accepted_values:
              arguments:
                values: ["calculated_from_disclosed_annual_flows"]
      - name: entity_code
        tests:
          - accepted_values:
              arguments:
                values: ["nintendo_co_ltd_consolidated"]
  - name: mart_lifetime_platform_sales
    description: >
      GRAIN: one life-to-date hardware or software-total observation for one
      source document, as-of date, metric, platform scope, and region. Two as-of
      dates for the same platform remain two rows. is_latest_as_of marks the
      later date and does not delete the earlier one. Software-title rankings
      are not included. These rows are point-in-time totals, not annual sales.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: period_span
        tests:
          - accepted_values:
              arguments:
                values: ["life_to_date"]
      - name: observation_type
        tests:
          - accepted_values:
              arguments:
                values: ["point_in_time_cumulative"]
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
  - name: mart_regional_performance
    description: >
      GRAIN: one disclosed fiscal-year sell-in flow for one metric, platform
      scope, and non-worldwide region. GLOBAL is not a row; disclosed_global_units
      repeats the worldwide total for that platform, metric, and year.
      europe_split and europe_inside_other are different region definitions and
      are not added together. reconciliation_status compares the disclosed
      worldwide total with the sum of the parts in that one layout.
    columns:
      - name: grain_key
        tests:
          - unique
          - not_null
      - name: fiscal_year_ending
        tests:
          - not_null
      - name: period_span
        tests:
          - accepted_values:
              arguments:
                values: ["fiscal_year"]
      - name: region_layout
        tests:
          - accepted_values:
              arguments:
                values: ["europe_split", "europe_inside_other", "incomplete_regional_breakdown"]
      - name: reconciliation_status
        tests:
          - accepted_values:
              arguments:
                values: ["exact", "within_one_printed_unit", "differs", "incomplete_breakdown", "mixed_region_layout"]
      - name: source_class
        tests:
          - accepted_values:
              arguments:
                values: ["official_ir"]
