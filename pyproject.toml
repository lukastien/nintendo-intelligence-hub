[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nintendo-intelligence-hub"
version = "0.1.0"
description = "Local business-intelligence foundation for public Nintendo disclosures and isolated synthetic operations data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "plotly>=5.22",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.8,<2",
    "dbt-postgres>=1.8,<2",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
bigquery = [
    "google-cloud-bigquery>=3.25",
    "dbt-bigquery>=1.8,<2",
]

[project.scripts]
nih = "nih.cli:main"

[tool.setuptools.packages.find]
include = [
    "nih*",
    "ingestion*",
    "transformations*",
    "warehouse*",
    "dashboards*",
    "forecasting*",
    "monitoring*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL warehouse",
]
